<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .navbar-wrapper {
      width: min(1800px, 95%);
      margin: 0 auto;
      position: relative;
    }

    .navbar-wrapper__shadow {
      position: absolute;
      inset: 0;
      transform: translate(14px, 18px);
      background: #2f2f31;
      border: 4px solid #2f2f31;
      border-radius: 30px;
      z-index: 0;
    }

    .navbar {
      position: relative;
      z-index: 1;
      height: 100px;
      background: #ffffff;
      border: 4px solid #2f2f31;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }

    .navbar__left {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .navbar__logo {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: #ff6b3d;
      border: 4px solid #2f2f31;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
    }

    .navbar__brand {
      font-size: 42px;
      font-weight: 800;
      color: #2f2f31;
      letter-spacing: -1px;
      line-height: 1;
    }

    .navbar__menu {
      display: flex;
      align-items: center;
      gap: 54px;
      margin-left: auto;
      margin-right: 38px;
    }

    .navbar__menu-item {
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      color: #8b8785;
      letter-spacing: -0.5px;
    }

    .navbar__menu-item:hover {
      color: #ff6b3d;
    }

    .navbar__lang {
      height: 62px;
      padding: 0 16px;
      border: 3px solid #2f2f31;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #fff;
      flex-shrink: 0;
    }

    .navbar__lang-label {
      font-size: 20px;
      font-weight: 500;
      color: #8b8785;
      margin-right: 2px;
    }

    .navbar__lang-btn {
      width: 70px;
      height: 46px;
      border-radius: 999px;
      border: 3px solid #2f2f31;
      background: #fff;
      color: #8b8785;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .navbar__lang-btn--active {
      background: #ff6b3d;
      color: white;
    }

    @media (max-width: 1200px) {
      .navbar {
        height: auto;
        padding: 24px 28px;
        gap: 20px;
        flex-wrap: wrap;
      }

      .navbar__menu {
        order: 3;
        width: 100%;
        justify-content: center;
        margin: 0;
        gap: 30px;
      }

      .navbar__brand {
        font-size: 34px;
      }

      .navbar__menu-item {
        font-size: 22px;
      }
    }

    @media (max-width: 700px) {
      .navbar__logo {
        width: 52px;
        height: 52px;
        font-size: 24px;
      }

      .navbar__brand {
        font-size: 28px;
      }

      .navbar__lang {
        height: 54px;
        padding: 0 12px;
      }

      .navbar__lang-btn {
        width: 58px;
        height: 40px;
        font-size: 18px;
      }

      .navbar__lang-label {
        font-size: 18px;
      }

      .navbar__menu {
        gap: 18px;
        display: none;
      }

      .navbar__menu-item {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="navbar-wrapper">
    <div class="navbar-wrapper__shadow"></div>

    <header class="navbar">
      <div class="navbar__left">
        <div class="navbar__logo">🐱</div>
        <h1 class="navbar__brand">Aido</h1>
      </div>

      <nav class="navbar__menu">
        <a href="#" class="navbar__menu-item">고양이 친구들</a>
        <a href="#" class="navbar__menu-item">패치 노트</a>
        <a href="#" class="navbar__menu-item navbar__menu-item">앱 다운로드</a>
      </nav>

      <div class="navbar__lang">
        <span class="navbar__lang-label">언어</span>
        <button class="navbar__lang-btn">KO</button>
        <button class="navbar__lang-btn">EN</button>
      </div>
    </header>
  </div>
<script>
  const buttons = document.querySelectorAll(".navbar__lang-btn");

  buttons.forEach((button) => {
    button.addEventListener("click", () => {

      buttons.forEach((btn) => {
        btn.classList.remove("navbar__lang-btn--active");
      });

      button.classList.add("navbar__lang-btn--active");

    });
  });
</script>
</body>
</html>
