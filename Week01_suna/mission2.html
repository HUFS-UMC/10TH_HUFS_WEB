<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Mission</title>
  <link rel="stylesheet" href="mission2.css">
</head>
<body>

  <div class="container">
    <header class="header-group">
      <div class="header-group__item header-group__item--dark">HEADER</div>
      <div class="header-group__item header-group__item--red">MENU</div>
    </header>

    <section class="hero">
      <div class="hero__content">HERO</div>
    </section>

    <main class="main-layout">
      <div class="main-layout__box main-layout__box--navy">MAIN</div>
      <div class="main-layout__box main-layout__box--empty"></div> <div class="main-layout__side-group">
        <div class="main-layout__box main-layout__box--light-blue">IMAGE</div>
        <div class="main-layout__box main-layout__box--green">EXTRA</div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer__banner">BANNER</div>
    </footer>
  </div>

</body>
</html>
