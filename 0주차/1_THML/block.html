<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Display 실습</title>

<!-- CSS 연결 -->
<link rel="stylesheet" href="style.css">

</head>
<body>

<h2>1. block</h2>
<div class="section">
    <div class="box block">block</div>
    <div class="box block">block</div>
</div>

<h2>2. inline</h2>
<div class="section">
    <span class="box inline">inline</span>
    <span class="box inline">inline</span>
</div>

<h2>3. inline-block</h2>
<div class="section">
    <div class="box inline-block">inline-block</div>
    <div class="box inline-block">inline-block</div>
</div>

</body>
</html>
