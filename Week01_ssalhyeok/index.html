<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<title>UMC Todo List</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="todo">

<h1 class="todo__title">UMC STUDY PLAN</h1>

<input
class="todo__input"
id="todo-input"
type="text"
placeholder="할 일을 입력하고 Enter"
/>

<div class="todo__container">

<section class="todo__section">

<h2 class="todo__subtitle">해야 할 일</h2>

<ul id="todo-list" class="todo__list"></ul>

</section>

<section class="todo__section">

<h2 class="todo__subtitle">완료한 일</h2>

<ul id="done-list" class="todo__list"></ul>

</section>

</div>

</div>

<script type="module" src="./dist/app.js"></script>

</body>

</html>
