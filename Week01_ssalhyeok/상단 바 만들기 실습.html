<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar 실습</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 50px;
  background-color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.navbar__logo {
  font-size: 1.8rem;
  font-weight: bold;
  cursor: pointer;
}

.navbar__menu {
  display: flex;
  gap: 30px;
}

.navbar__menu a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
  transition: color 0.3s;
}

.navbar__menu a:hover {
  color: #007BFF;
}

.navbar__buttons {
  display: flex;
  gap: 10px;
}

.navbar__buttons .btn {
  padding: 8px 15px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  border: none;
  transition: all 0.3s;
}

.btn--login {
  background-color: transparent;
  color: #333;
  border: 1px solid #333;
}

.btn--login:hover {
  background-color: #333;
  color: #fff;
}

.btn--signup {
  background-color: #007BFF;
  color: #fff;
}

.btn--signup:hover {
  background-color: #0056b3;
}

.btn--lang {
  background-color: #f0f0f0;
  color: #333;
}

.btn--lang:hover {
  background-color: #ddd;
}

.btn--lang.active {
  background-color: #007BFF;
  color: #fff;
}

@media (max-width: 600px) {
  .navbar__menu a,
  .btn--signup {
    display: none;
  }

  .navbar {
    padding: 15px 20px;
  }
}
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar__logo" id="logo">고양이 친구들</div>
  <nav class="navbar__menu">
    <a href="#" data-ko="홈" data-en="Home">홈</a>
  </nav>
  <div class="navbar__buttons">
    <button class="btn btn--login">Login</button>
    <button class="btn btn--signup" id="btn-signup">출시 알림 받기</button>
    <button class="btn btn--lang active" id="btn-ko">KO</button>
    <button class="btn btn--lang" id="btn-en">EN</button>
  </div>
</header>

<script>
const menuLinks = document.querySelectorAll(".navbar__menu a");
const logo = document.getElementById("logo");
const signupBtn = document.getElementById("btn-signup");
const btnKo = document.getElementById("btn-ko");
const btnEn = document.getElementById("btn-en");

btnKo.addEventListener("click", () => {
  menuLinks.forEach(link => link.textContent = link.getAttribute("data-ko"));
  logo.textContent = "고양이 친구들";
  signupBtn.textContent = "출시 알림 받기";
  btnKo.classList.add("active");
  btnEn.classList.remove("active");
});

btnEn.addEventListener("click", () => {
  menuLinks.forEach(link => link.textContent = link.getAttribute("data-en"));
  logo.textContent = "Cat Friends";
  signupBtn.textContent = "Get Notified";
  btnEn.classList.add("active");
  btnKo.classList.remove("active");
});
</script>

</body>
</html>
