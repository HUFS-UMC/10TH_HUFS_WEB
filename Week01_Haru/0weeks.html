<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <style>

        .header-box {
            width: 100%;
            height: 60px;

            display: flex;
            align-items: center;
        }

        .headBox {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            color: white;
            padding: 0;

            width: 30%;
            height: 100%;
        }

        .menuBox {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: red;
            color: white;
            padding: 0;

            flex-grow: 1;
            height: 100%;
        }

        .heroBox {
            width: 100%;
            height: 200px;
            background-color: skyblue;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box2 {
            display: grid;
            grid-template-areas: 
            "main . image"
            "main . extra";
            grid-template-columns: 2fr 1fr 1.5fr;
            grid-template-rows: 1fr 1fr;

            width: 100%;
            height: 200px;
        }

        .mainBox {
            grid-area: main;
            background-color: darkblue;
            color: white;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .imageBox {
            grid-area: image;
            background-color: aquamarine;
            color: black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .extraBox {
            grid-area: extra;
            background-color: cadetblue;
            color: black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bannerBox {
            width: 100%;
            height: 100px;
            background-color: yellow;
            color: black;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="header-box"> 
        <span class="headBox">HEADER</span>
        <span class="menuBox">MENU</span>
    </div>
    <div class="heroBox">HERO</div>
    <div class="box2">
        <span class="mainBox">MAIN</span>
        <span class="imageBox">IMAGE</span>
        <span class="extraBox">EXTRA</span>
    </div>
    <div class="bannerBox">BANNER</div>
</body>
