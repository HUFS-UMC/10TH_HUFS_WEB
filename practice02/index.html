<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
    }

    .layout__top {
      display: flex;
    }

    .layout__header,
    .layout__nav,
    .layout__hero,
    .layout__main,
    .layout__image,
    .layout__extra,
    .layout__footer {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .layout__header {
      width: 30%;
      height: 80px;
      background: navy;
      color: white;
    }

    .layout__nav {
      width: 70%;
      height: 80px;
      background: rgb(255, 95, 95);
      color: white;
    }

    .layout__hero {
      width: 100%;
      height: 400px;
      background: rgb(124, 182, 252);
      color: white;
    }

    .layout__content {
      display: flex;
    }

    .layout__main {
      width: 50%;
      height: 400px;
      background: rgb(32, 40, 75);
      color: white;
    }

    .layout__blank {
      width: 25%;
      background: white;
    }

    .layout__side {
      width: 25%;
      display: grid;
      grid-template-rows: 1fr 1fr;
    }

    .layout__image {
      background: rgb(190, 238, 230);
      color: white;
    }

    .layout__extra {
      background: rgb(71, 174, 157);
      color: white;
    }

    .layout__footer {
      width: 100%;
      height: 100px;
      background: rgb(255, 228, 106);
      color: white;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="layout__top">
      <header class="layout__header">HEADER</header>
      <nav class="layout__nav">MENU</nav>
    </div>

    <section class="layout__hero">HERO</section>

    <div class="layout__content">
      <main class="layout__main">MAIN</main>
      <div class="layout__blank"></div>
      <div class="layout__side">
        <section class="layout__image">IMG</section>
        <section class="layout__extra">EXTRA</section>
      </div>
    </div>

    <footer class="layout__footer">BANNER</footer>
  </div>
</body>
</html>
