<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .box {
        width: 70%;
        height: 40px;
        background-color: white;
        padding: 0 10px;
        box-sizing: border-box;

        border: 3px solid black;
        border-radius: 15px;
        font-family: "Apple SD Gothic Neo", sans-serif;
        position: relative;
        min-width: 0;

        display: flex;
        align-items: center;

        overflow: hidden;
        white-space: nowrap;
        
    }

    .content {
        width: 65px;
        height: 25px;
        background-color: white;
        padding-left: 10px;
        border: 3px solid black;
        border-radius: 15px;
        flex-shrink: 0;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        padding: 0;
    }

    .kor, .eng {
        width: 20px;
        height: 20px;
        background-color: white;
        padding-left: 0;
        border: 2px solid black;
        border-radius: 15px;
        flex-shrink: 0;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 10px;

        cursor: pointer;
    }

    .active {
        background-color: orange;
        color: white;
    }

    .icon {
            background-image: url(https://wimg.munhwa.com/news/cms/2025/07/09/news-p.v1.20250707.f0a19caf4fc84dc696a649ada68559f3_P1.jpg);
            background-repeat: no-repeat;
            width: 25px;
            height: 25px;
            background-size: cover;
            background-position: center;
            border: 3px solid black;
            flex-shrink: 0;
            margin-right: 10px;
            border-radius: 15px;
        }

    .rightgr {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-left: auto;
        flex-shrink: 1;
        justify-content: flex-end;
        min-width: 0;
    }

    .korc, .engc {
        color: gray;
    }

    .friend {
        overflow: hidden;
        color: gray;
        overflow: hidden;
        min-width: 0;
        flex-shrink: 1;
    }

    .name {
        font-weight: bold;
        flex-shrink: 1;
        overflow: hidden;
        min-width: 0;
        margin-right: auto;
    }

    .app {
        color: orange;
        min-width: 0;
        overflow: hidden;
        flex-shrink: 1;

    }

    .friend:hover {
        color: orange;
        cursor: pointer;
    }
    .app:hover {
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
    }

    @media(max-width: 700px) {
        .friend, .app {
            display: none;
        }
    }


    </style>
</head>

<body>
    <div class="box">
        <div class="icon"></div>
        <span class="name">Aido</span>

        <div class="rightgr">
            <span class = "friend">고양이 친구들</span>
            <span class="app">  앱 다운로드</span>
            <div class="content">
                <div class="kor active" onclick="changelang(this)">KO</div>
                <div class="eng" onclick="changelang(this)">EN</div>
                </div>
            </div>
    </div>

    <script>
        function changelang(element) {
            document.querySelectorAll('.kor, .eng').forEach(el=>{el.classList.remove('active')});
        element.classList.add('active');
        }
    </script>
</body>

</html>
