<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMC 10th ToDo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <header class="todo-header">
            <h1 class="todo-header__title">UMC Study Plan</h1>
        </header>

        <section class="todo-input-section">
            <input type="text" id="todo-input" class="todo-input-section__input" placeholder="스터디 계획을 작성해보세요!" autofocus>
        </section>

        <main class="todo-main">
            <div class="todo-list-container">
                <h2 class="todo-list-container__title">해야 할 일</h2>
                <ul id="todo-list" class="todo-list"></ul>
            </div>

            <div class="todo-list-container">
                <h2 class="todo-list-container__title">해낸 일</h2>
                <ul id="done-list" class="todo-list"></ul>
            </div>
        </main>
    </div>

    <script type="module" src="dist/todo.js"></script>
</body>
</html>
