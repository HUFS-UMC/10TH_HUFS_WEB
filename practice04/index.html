<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UMC Study Plan</title>
  <link rel="stylesheet" href="./style.css"/>
  <style>
  </style>
</head>
<body>
    <main class="plan">
        <header class="plan__header">
            <h1 class="title">UMC Study Plan</h1>
        </header>

        <form class="plan__form" id="plan__form">
            <input 
                type="text"
                class="plan__input"
                id="plan__input"
                placeholder="스터디 계획을 작성해보세요!"/>
        </form>

        <section class="plan__lists">
            <article class="plan__article">
                <h3 class="plan__title">해야 할 일</h3>
                <ul class="plan__list" id="todolist"></ul>
            </article>
            <article class="plan__article">
                <h3 class="plan__title">해낸 일</h3>
                <ul class="plan__list" id="donelist"></ul>
            </article>
        </section>
    </main>
    <script src="./dist/script.js"></script>
</body>
</html>
